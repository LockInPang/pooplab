<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#241a15"><title>Poop Lab</title>
<style>*{box-sizing:border-box}body{margin:0;background:#241a15;color:#fff1db;font-family:system-ui,sans-serif;overscroll-behavior:none}main{height:100dvh;display:flex;flex-direction:column;padding:12px;gap:10px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}button{border:0;border-radius:12px;background:#dfaa69;padding:9px 14px;font-weight:700;color:#322013}canvas{background:linear-gradient(#f5e3c7,#dfc39f);border-radius:16px;flex:1;min-height:0;width:100%;touch-action:none}section{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:env(safe-area-inset-bottom)}label{font-size:13px}input{width:100%;accent-color:#d9a16b}small{color:#d7c4ad}</style></head>
<body><main><header><h1>💩 Poop Lab</h1><button id="reset">重新生成</button></header><canvas id="game"></canvas><section><label>软硬度 <input id="hard" type="range" min="1" max="100" value="55"></label><label>阻尼 <input id="damp" type="range" min="1" max="100" value="40"></label></section><small>手指按住屎拖动，松手甩出去 · XPBD 软体模拟</small></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hard=document.querySelector('#hard'),damp=document.querySelector('#damp');
let W=300,H=500,pts=[],edges=[],tris=[],grab=-1,mouse={x:0,y:0},last=performance.now(),acc=0;
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}
function reset(){pts=[];edges=[];tris=[];grab=-1;const cols=9,rows=7,step=Math.min(W/12,32),ox=W/2-(cols-1)*step/2,oy=Math.min(100,H*.22);
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let x=ox+i*step,y=oy+j*step;pts.push({x,y,px:x,py:y,inv:1})}
let seen=new Set();function edge(a,b){let key=[Math.min(a,b),Math.max(a,b)].join('-');if(seen.has(key))return;seen.add(key);let p=pts[a],q=pts[b];edges.push({a,b,len:Math.hypot(p.x-q.x,p.y-q.y),lambda:0})}
for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){let a=j*cols+i,b=a+1,c=a+cols,d=c+1;for(let t of [[a,b,d],[a,d,c]]){tris.push(t);edge(t[0],t[1]);edge(t[1],t[2]);edge(t[2],t[0])}}
}
function solveEdge(e,alpha){let a=pts[e.a],b=pts[e.b],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,C=L-e.len,dl=(-C-alpha*e.lambda)/(2+alpha);e.lambda+=dl;let nx=dx/L,ny=dy/L;a.x-=nx*dl;a.y-=ny*dl;b.x+=nx*dl;b.y+=ny*dl}
function step(){let dt=1/120,drag=.995-Number(damp.value)*.0009;
for(let p of pts){let vx=(p.x-p.px)*drag,vy=(p.y-p.py)*drag;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+1400*dt*dt}
for(let e of edges)e.lambda=0;
let alpha=Math.pow(1-Number(hard.value)/105,3)*.035;
for(let iter=0;iter<9;iter++){for(let e of edges)solveEdge(e,alpha);
if(grab>=0){let p=pts[grab];p.x+=(mouse.x-p.x)*.65;p.y+=(mouse.y-p.y)*.65}
for(let p of pts){if(p.x<9)p.x=9;if(p.x>W-9)p.x=W-9;if(p.y<9)p.y=9;if(p.y>H-18)p.y=H-18}}
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#b99c7c';ctx.fillRect(0,H-13,W,13);
ctx.beginPath();for(let t of tris){let a=pts[t[0]],b=pts[t[1]],c=pts[t[2]];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath()}ctx.fillStyle='#8d542d';ctx.fill();
ctx.strokeStyle='rgba(255,218,162,.17)';ctx.lineWidth=1;for(let e of edges){let a=pts[e.a],b=pts[e.b];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
if(grab>=0){let p=pts[grab];ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.strokeStyle='#ffdb8d';ctx.lineWidth=3;ctx.stroke()}
}
function frame(now){let elapsed=Math.min((now-last)/1000,.05);last=now;acc+=elapsed;let n=0;while(acc>=1/120&&n++<6){step();acc-=1/120}draw();requestAnimationFrame(frame)}
function pointer(e){let r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e);let best=Infinity;grab=-1;for(let i=0;i<pts.length;i++){let p=pts[i],d=Math.hypot(p.x-mouse.x,p.y-mouse.y);if(d<best){best=d;grab=i}}if(best>65)grab=-1;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
function release(){grab=-1}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
document.querySelector('#reset').addEventListener('click',reset);window.addEventListener('resize',()=>{resize();reset()});resize();reset();requestAnimationFrame(frame);
})();
</script></body></html>
